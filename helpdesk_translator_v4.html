<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Help Desk 週報翻譯機</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f5f4f0;
  --tx:#1a1a18;--tx2:#5f5e5a;--tx3:#888780;
  --bd:rgba(0,0,0,0.4);--bd2:rgba(0,0,0,0.3);--bd3:rgba(0,0,0,0.15);
  --r:8px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1e1e1c;--bg2:#2a2a28;
  --tx:#f0ede6;--tx2:#b4b2a9;--tx3:#888780;
  --bd:rgba(255,255,255,0.4);--bd2:rgba(255,255,255,0.3);--bd3:rgba(255,255,255,0.15);
}}
body{font-family:var(--font);background:var(--bg);color:var(--tx);min-height:100vh;display:flex;justify-content:center;padding:2.5rem 1rem 4rem}
#app{width:100%;max-width:600px;display:flex;flex-direction:column;gap:1.25rem}
.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--tx3);text-transform:uppercase}
.title{font-size:19px;font-weight:500;color:var(--tx);margin-top:3px}
.field-label{font-size:12px;color:var(--tx2);margin-bottom:6px;letter-spacing:.04em}
textarea{width:100%;min-height:100px;resize:vertical;border:.5px solid var(--bd2);border-radius:var(--r);padding:9px 11px;font-size:14px;font-family:var(--font);color:var(--tx);background:var(--bg);line-height:1.7;outline:none;transition:border-color .15s}
textarea:focus{border-color:var(--bd)}
textarea::placeholder{color:var(--tx3)}
#outputBox{width:100%;background:var(--bg2);border:.5px solid var(--bd3);border-radius:var(--r);padding:10px 11px 40px;min-height:90px;position:relative;font-size:14px;line-height:1.85;color:var(--tx);white-space:pre-wrap}
.hint{color:var(--tx3);font-size:13px}
.row{display:flex;justify-content:flex-end}
button.btn{padding:6px 15px;font-size:13px;font-weight:500;border:.5px solid var(--bd2);border-radius:var(--r);background:var(--bg);color:var(--tx);cursor:pointer;transition:background .12s,transform .08s}
button.btn:hover{background:var(--bg2)}
button.btn:active{transform:scale(.97)}
.copy-btn{position:absolute;bottom:7px;right:8px;font-size:11px;color:var(--tx3);background:none;border:.5px solid var(--bd3);border-radius:var(--r);padding:3px 9px;cursor:pointer;transition:color .1s}
.copy-btn:hover{color:var(--tx2)}
.divider{height:.5px;background:var(--bd3)}
</style>
</head>
<body>
<div id="app">
  <div>
    <div class="eyebrow">Help Desk · 週報翻譯機</div>
    <div class="title">白話 → 企業語</div>
  </div>
  <div>
    <div class="field-label">工作內容（說人話，每行一件事）</div>
    <textarea id="inp" placeholder="每行輸入一件事，數量可加 *N 在結尾"></textarea>
  </div>
  <div class="row">
    <button class="btn" onclick="run()">翻譯成週報語言 →</button>
  </div>
  <div class="divider"></div>
  <div>
    <div class="field-label">週報專業版</div>
    <div id="outputBox"><span class="hint">翻譯結果將顯示在這裡…</span></div>
  </div>
</div>

<script>
function numFromRaw(s){const m=s.match(/\*\s*(\d+)/);return m?m[1]:null}

const RULES=[
  [/(?:製作|建立|備份)\s*\S*\s*image\s*backup/i,
    (t)=>`建立系統映像檔備份基準，確保災難復原能力與部署一致性`],
  [/(?:重設|重置|設定|製作|倒|建立|設定&製作|設定.*製作)\s*\S*\s*基礎\s*image/i,
    (t)=>{ const n=numFromRaw(t); return `完成${n?` ${n} 台`:''}基礎系統映像檔製作與部署環境標準化設定` }],
  [/(?:製作|建立)\s*.*?image\s*\(?([^)\s]*)\)?/i,
    (t,model)=>`完成 ${model||'指定機型'} 系統映像檔製作，建立標準部署基準`],
  [/倒\s*image.*?(?:調整|更新|統一).*?\*\s*(\d+)/i,
    (t,n)=>`完成 ${n} 台桌機系統映像檔重新部署並執行組態統一更新作業`],
  [/(?:倒|部署|還原|套用)\s*image.*?更新.*?備用.*?\*\s*(\d+)/i,
    (t,n)=>`完成 ${n} 台備用設備系統映像檔更新，確保備援機組就緒狀態`],
  [/(?:倒|部署|還原|套用)\s*image.*?備用.*?\*\s*(\d+)/i,
    (t,n)=>`完成 ${n} 台備用設備系統映像檔重新部署，確保標準化一致性`],
  [/重設.*?備用.*?(?:做|&|＆)\s*image/i,
    ()=>`執行備用設備系統重置並完成標準映像檔部署，恢復設備至基準配置`],
  [/(?:重設|重置|更新)\s*.*?asus\s*桌機.*?(?:更新\s*)?image/i,
    ()=>`執行 Asus 桌機系統重置並更新映像檔，確保設備標準化配置`],
  [/(?:倒|部署|還原|套用)\s*image.*?替換.*?硬碟/i,
    ()=>`完成替換硬碟後之系統映像檔部署，確保設備恢復正常運作`],
  [/(?:倒|部署|還原|套用|更新)\s*image.*?\*\s*(\d+)/i,
    (t,n)=>`完成 ${n} 台設備系統映像檔部署更新，確保端點配置標準化`],
  [/倒\s*image|部署\s*image|還原\s*image|套用\s*image|更新\s*image/i,
    ()=>`執行系統映像檔部署作業，確保設備配置標準化`],

  [/重置.*?離職.*?設備.*?(?:做|&|＆)\s*image/i,
    ()=>`完成離職人員設備資料清除重置，並執行標準映像檔部署作業`],
  [/回收.*?離職.*?設備|離職.*?設備.*?回收/i,
    ()=>`執行離職人員設備資產回收作業，完成設備盤點與保管移交`],
  [/派發.*?復職.*?(?:設備|額外申請)/i,
    ()=>`完成復職人員設備需求評估與設備派發，確保作業環境即時就緒`],

  [/協助.*?(\d+\/\d+).*?新人.*?報到/i,
    (t,date)=>`協助 ${date} 新進人員完成報到設備環境建置，確保第一天上線順暢`],
  [/設定.*?新人.*?報到.*?(?:筆電|NB)/i,
    ()=>`完成新進人員報到筆電環境設定，確保系統存取與周邊設定就緒`],
  [/新人.*?報到|報到.*?新人/i,
    ()=>`協助新進人員完成報到設備環境建置，確保系統存取與周邊設定就緒`],

  [/重置.*?回收.*?iphone.*?\*\s*(\d+)/i,
    (t,n)=>`完成 ${n} 台回收 iPhone 資料清除與系統重置作業`],
  [/報廢.*?手機.*?\*\s*(\d+)/i,
    (t,n)=>`執行 ${n} 台無資產編號手機報廢作業，完成資產除帳申請`],
  [/設定.*?公務\s*手機.*?\*\s*(\d+)/i,
    (t,n)=>`完成 ${n} 台公務手機設定與發放，確保通訊服務開通`],
  [/更新.*?手機.*?\*\s*(\d+)/i,
    (t,n)=>`完成 ${n} 台公務手機系統更新與組態設定驗證`],
  [/設定.*?手機|重置.*?手機|重設.*?手機/i,
    ()=>`執行行動裝置組態設定與驗證，確保行動辦公環境就緒`],
  [/回收.*?手機|手機.*?回收/i,
    ()=>`完成行動裝置資產回收作業，執行資料清除與設備保管移交`],

  [/重設.*?收回.*?macbook.*?\*\s*(\d+)/i,
    (t,n)=>`執行 ${n} 台回收 MacBook 系統重置與資料清除，恢復出廠標準配置`],
  [/回收.*?macbook.*?\*\s*(\d+)/i,
    (t,n)=>`完成 ${n} 台 MacBook 資產回收作業，完成設備盤點與保管`],
  [/回收.*?重置.*?mac|重置.*?mac/i,
    ()=>`執行 Mac 系列設備資產回收與系統重置，完成資料清除及設備保管移交`],
  [/回收.*?mac|mac.*?回收/i,
    ()=>`完成 Mac 系列設備資產回收，執行設備盤點與保管移交`],

  [/(?:重設|設定)\s*asus\s*筆電/i,
    ()=>`執行 Asus 筆電系統重置與基礎環境設定，恢復標準部署配置`],
  [/(?:設定|製作|建立|重設).*?基礎.*?(?:t470p|t480|t470)/i,
    (t)=>{ const model=(t.match(/t\d+p?/i)||[''])[0].toUpperCase()||'商務筆電'; return `完成 ${model} 基礎系統映像檔製作與部署環境標準化設定` }],
  [/重設.*?(?:筆電|NB).*?基礎/i,
    (t)=>`執行筆電系統重置與基礎環境設定，確保端點部署符合標準規範`],
  [/設定.*?(?:居家|遠端|在家).*?(?:筆電|NB).*?\*\s*(\d+)/i,
    (t,n)=>`完成 ${n} 台居家辦公筆電環境設定，確保遠端作業基礎架構就緒`],
  [/更新.*?測試.*?(?:筆電|NB).*?電池.*?\*\s*(\d+)/i,
    (t,n)=>`完成 ${n} 台筆電電池續航力更新測試，記錄電源效能基準數據`],
  [/設定.*?(?:筆電|NB).*?基礎|筆電.*?基礎.*?設定/i,
    ()=>`執行筆電基礎系統環境設定，確保端點標準化配置完成`],
  [/設定.*?(?:筆電|NB)|(?:筆電|NB).*?設定/i,
    ()=>`執行筆電系統環境設定與功能驗證，確保設備就緒狀態`],

  [/整理.*?回收.*?PC.*?移除.*?(?:硬碟|記憶體|顯卡).*?\*\s*(\d+)/i,
    (t,n)=>`完成 ${n} 台待回收 PC 零組件（硬碟、記憶體、顯卡）拆除，確保資料安全與資產分類管理`],
  [/清除.*?PC.*?移除.*?(?:硬碟|記憶體).*?\*\s*(\d+)/i,
    (t,n)=>`執行 ${n} 台回收 PC 資料清除，完成硬碟與記憶體拆除及資產重分類`],
  [/移除.*?(?:硬碟|記憶體|顯卡)|拆除.*?(?:硬碟|記憶體|顯卡)/i,
    ()=>`執行設備零組件拆除作業，完成資料安全處理與資產分類管理`],

  [/清除.*?(?:筆電|NB).*?資料.*?\*\s*(\d+)/i,
    (t,n)=>`完成 ${n} 台回收筆電資料清除作業，確保儲存媒體符合資安銷毀規範`],
  [/清除.*?硬碟.*?異常|硬碟.*?異常.*?清除/i,
    ()=>`診斷並排除硬碟異常故障，執行磁碟健康狀態復原作業`],
  [/替換.*?硬碟|硬碟.*?替換/i,
    ()=>`完成故障硬碟替換作業，恢復儲存設備可用性`],

  [/(?:重設|重置|reset)\s*(\d+)\s*個?密碼/i,
    (t,n)=>`執行 ${n} 起身份驗證憑證更新作業，維護帳戶安全合規性`],
  [/(?:重設|重置|reset).*?密碼/i,
    ()=>`執行身份驗證憑證更新作業，確保帳戶存取安全`],

  [/協助.*?新增.*?印表機/i,
    ()=>`協助使用者完成列印服務新增設定，確保印表機資源正確對應`],
  [/修.*?印表機|印表機.*?修/i,
    ()=>`針對列印服務基礎設施執行故障排除，確保輸出設備穩定運作`],

  [/檢查.*?(?:補齊|更新).*?公務機.*?描述檔/i,
    ()=>`執行公務行動裝置 MDM 描述檔完整性稽核，補齊缺漏組態確保合規管理`],
  [/公務機.*?描述檔|描述檔.*?公務機/i,
    ()=>`執行公務行動裝置描述檔組態驗證，確保 MDM 管理策略一致性`],

  [/驗證.*?pdf.*?編輯器.*?安裝.*?授權/i,
    ()=>`完成 PDF 編輯器安裝授權驗證，確保軟體合規授權使用`],
  [/更新.*?winrar/i,
    ()=>`執行 WinRAR 軟體版本更新，確保壓縮工具維持最新安全版本`],
  [/更新.*?軟體版本|軟體.*?版本.*?更新/i,
    ()=>`執行端點軟體版本更新，確保應用程式維持最新安全修補狀態`],
  [/安裝.*?雲桌面.*?軟體|雲桌面.*?軟體.*?安裝/i,
    ()=>`完成雲桌面環境所需軟體安裝部署，確保虛擬桌面基礎服務就緒`],
  [/裝[了好]?\s*(\d+)\s*套?.*(軟體|程式|app)/i,
    (t,n)=>`完成 ${n} 套應用程式標準化部署`],
  [/裝[了好]?.*(軟體|程式|app)/i,
    ()=>`完成應用程式標準化部署作業`],

  [/(?:理解|研究|確認).*?冰點.*?(?:版本|授權|更新)/i,
    ()=>`研析冰點還原軟體版本授權更新機制，建立版本生命週期管理知識基準`],
  [/重設.*?冰點.*?PC|冰點.*?PC.*?重設/i,
    ()=>`執行冰點還原系統 PC 重設，完成 RAM 與磁碟健康檢查及網路連線驗證`],

  [/檢測.*?螢幕.*?亮度|螢幕.*?亮度.*?檢測/i,
    ()=>`執行螢幕亮度調整功能檢測，記錄顯示設備功能異常排查結果`],
  [/換[了好]?\s*(\d+)\s*個?.*(鍵盤|滑鼠|螢幕|顯示器|耳機)/i,
    (t,n)=>`完成 ${n} 台周邊設備汰換作業`],
  [/換[了好]?.*(鍵盤|滑鼠|螢幕|顯示器|耳機)/i,
    ()=>`完成周邊設備汰換與功能驗收作業`],

  [/驗證.*?黑頻|黑頻.*?驗證|黑頻.*?問題/i,
    ()=>`執行顯示輸出黑頻異常問題驗證，完成硬體相容性與驅動程式排查`],
  [/嘗試.*?更新.*?PC.*?最新版本|更新.*?PC.*?最新版本.*?測試/i,
    ()=>`執行端點設備系統版本升級可行性測試，評估更新相容性與穩定性`],

  [/測試.*?claude.*?(?:對比|比較).*?(?:gpt|gemini)/i,
    ()=>`評測主流 AI 輔助工具故障排查建議品質，建立工具選用評估基準`],
  [/(?:自|從).*?microsoft\s*learn.*?學習|microsoft\s*learn.*?訓練/i,
    ()=>`完成 Microsoft Learn 平台自主技術訓練，強化端點管理與雲端服務知識`],
  [/學習.*?訓練|自主.*?學習/i,
    ()=>`執行技術能力自主培訓，強化 IT 維運知識基礎`],

  [/整理.*?更新.*?設置流程|設置流程.*?整理/i,
    ()=>`整理並更新設備設置標準作業流程文件，確保部署程序知識留存`],

  [/更新.*?(?:居家|遠端|在家).*?(?:筆電|NB).*?VPN.*?\*\s*(\d+)/i,
    (t,n)=>`完成 ${n} 台居家辦公筆電 VPN 域名組態更新，確保遠端存取連線穩定性`],
  [/更新.*?VPN.*?\*\s*(\d+)/i,
    (t,n)=>`完成 ${n} 台端點設備 VPN 域名組態更新，強化遠端連線安全性`],
  [/更新.*?VPN|VPN.*?更新/i,
    ()=>`執行 VPN 域名組態更新，確保遠端存取服務穩定運作`],
  [/VPN/i,
    ()=>`協助使用者建立 VPN 安全通道，確保遠端存取合規`],

  [/修[了好]?\s*(\d+)\s*台.*(電腦|PC|主機|桌機)/i,
    (t,n)=>`優化 ${n} 台終端設備部署，確保硬體可用性達標`],
  [/修[了好]?.*(電腦|PC|主機|桌機)/i,
    ()=>`執行終端設備故障排除，恢復正常運作狀態`],

  [/回收.*?整理.*?(?:設備|PC|UPS).*?(?:倉庫|展帆)|整理.*?回收.*?設備/i,
    ()=>`執行汰除設備資產回收作業，完成倉儲入庫登記與資產管理更新`],
  [/整理.*?UPS|UPS.*?整理|回收.*?UPS/i,
    ()=>`執行 UPS 設備資產盤點與倉儲整理作業`],
  [/整理.*?倉庫|倉庫.*?整理/i,
    ()=>`執行倉儲空間整理與設備資產盤點作業`],

  [/(?:系統|OS|Windows).*?更新/i,
    ()=>`推動端點設備系統更新，強化資安防護基線`],
  [/清.*(病毒|木馬|惡意)/i,
    ()=>`執行端點資安威脅清除作業，恢復設備安全狀態`],
  [/備份/i,
    ()=>`執行資料備份作業，確保業務持續性與資料完整性`],
  [/(?:設定|連|接).*?(?:信箱|email|mail|outlook)/i,
    ()=>`完成企業電子郵件用戶端設定，確保通訊服務正常運作`],
  [/教.*(用|操作|設定)/i,
    ()=>`執行使用者數位賦能培訓，提升作業效率`],
];

function translate(raw){
  const line=raw.trim();
  if(!line) return null;
  for(const [pat,fn] of RULES){
    const r=new RegExp(pat.source,'i');
    const m=r.exec(line);
    if(m) return fn(line,...m.slice(1));
  }
  const n=numFromRaw(line);
  const base=line.replace(/\*\s*\d+\s*$/,'').trim();
  return `完成${n?` ${n} 件`:''}「${base}」相關技術作業，確保服務品質達標`;
}

function run(){
  const lines=document.getElementById('inp').value.split('\n').filter(l=>l.trim());
  if(!lines.length) return;
  const results=lines.map(l=>'・'+translate(l)).join('\n');
  const box=document.getElementById('outputBox');
  box.innerHTML='';
  const txt=document.createElement('span');
  txt.textContent=results;
  box.appendChild(txt);
  const cpb=document.createElement('button');
  cpb.className='copy-btn';
  cpb.textContent='複製';
  cpb.onclick=()=>{
    navigator.clipboard.writeText(results).then(()=>{
      cpb.textContent='已複製';
      setTimeout(()=>cpb.textContent='複製',1500);
    });
  };
  box.appendChild(cpb);
}
</script>
</body>
</html>
